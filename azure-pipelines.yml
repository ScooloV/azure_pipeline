trigger:
  branches:
    include:
      - main

strategy:
  matrix:
    ubuntu_22_04:
      vmImage: ubuntu-22.04
    ubuntu_24_04:
      vmImage: ubuntu-24.04
    ubuntu_26_04:
      vmImage: ubuntu-26.04

pool:
  vmImage: $(vmImage)

variables:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

steps:
  - checkout: none

  - bash: |
      set -euo pipefail

      for path in \
        /usr/local/lib/android \
        /usr/share/dotnet \
        /usr/local/.ghcup \
        /usr/share/swift; do
        printf '\n=== Cleanup: %s ===\n' "$path"
        if [[ ! -e "$path" && ! -L "$path" ]]; then
          echo 'Directory is absent; skipping.'
          continue
        fi

        sync
        before_bytes="$(df -B1 --output=avail / | awk 'NR == 2 {print $1}')"
        started="$(date +%s.%N)"
        sudo rm -rf -- "$path"
        deleted="$(date +%s.%N)"
        sync
        finished="$(date +%s.%N)"
        after_bytes="$(df -B1 --output=avail / | awk 'NR == 2 {print $1}')"

        awk -v before="$before_bytes" -v after="$after_bytes" \
          -v started="$started" -v deleted="$deleted" -v finished="$finished" \
          'BEGIN {
            printf "Free before: %.3f GiB (%s bytes)\n", before / 1073741824, before
            printf "Free after: %.3f GiB (%s bytes)\n", after / 1073741824, after
            printf "Space reclaimed: %.3f GiB (%.0f bytes)\n", (after - before) / 1073741824, after - before
            printf "Deletion time: %.3f seconds\n", deleted - started
            printf "Deletion and sync time: %.3f seconds\n", finished - started
          }'
      done
    displayName: Remove Linux SDKs with individual time and space measurements

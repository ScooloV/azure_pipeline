trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  targetFeed: ccse-hmi-dev/azure_pipeline
  targetPackage: hello-world-linux

steps:
  - checkout: self

  - bash: |
      set -euo pipefail

      echo '=== Operating system ==='
      cat /etc/os-release
      uname -a

      echo '=== CPU ==='
      lscpu

      echo '=== Memory ==='
      free -h

      echo '=== Disk ==='
      df -h .

      echo '=== Tools ==='
      g++ --version
      git --version
      unzip -v

      echo '=== Azure Pipelines ==='
      printf 'Agent: %s\nOS: %s\nArchitecture: %s\n' "$AGENT_NAME" "$AGENT_OS" "$AGENT_OSARCHITECTURE"
      printf 'Build ID: %s\nBranch: %s\nCommit: %s\n' "$BUILD_BUILDID" "$BUILD_SOURCEBRANCH" "$BUILD_SOURCEVERSION"
      printf 'Sources: %s\n' "$BUILD_SOURCESDIRECTORY"
      printf 'Image: %s (%s)\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
    displayName: Show environment information

  - bash: |
      set -euo pipefail
      mkdir -p build/source
      cp main.cpp build/source/main.cpp
    displayName: Prepare source from repository

  - bash: |
      set -euo pipefail
      mkdir -p build
      g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic build/source/main.cpp -o build/hello-world
    displayName: Compile C++ Hello World

  - bash: |
      set -euo pipefail
      output="$(./build/hello-world)"
      printf '%s\n' "$output"
      if [[ "$output" != 'Hello, world!' ]]; then
        echo 'Unexpected program output' >&2
        exit 1
      fi
    displayName: Run and verify Hello World

  - task: UniversalPackages@0
    displayName: Publish executable to Azure Artifacts
    inputs:
      command: publish
      publishDirectory: '$(Build.SourcesDirectory)/build'
      feedsToUsePublish: internal
      vstsFeedPublish: '$(targetFeed)'
      vstsFeedPackagePublish: '$(targetPackage)'
      versionOption: custom
      versionPublish: '1.1.$(Build.BuildId)'
      packagePublishDescription: 'Built from commit $(Build.SourceVersion)'

trigger:
  branches:
    include:
      - main

strategy:
  matrix:
    ubuntu_22_04:
      vmImage: ubuntu-22.04
    ubuntu_24_04:
      vmImage: ubuntu-24.04
    ubuntu_26_04:
      vmImage: ubuntu-26.04

pool:
  vmImage: $(vmImage)

variables:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

steps:
  - checkout: none

  - bash: |
      set -euo pipefail

      echo '=== Before SDK cleanup ==='
      sync
      df -B1 -T /
      before_bytes="$(df -B1 --output=avail / | awk 'NR == 2 {print $1}')"

      echo '=== Removing Android, .NET, Haskell and Swift ==='
      SECONDS=0
      sudo rm -rf -- \
        /usr/local/lib/android \
        /usr/share/dotnet \
        /usr/local/.ghcup \
        /usr/share/swift
      removal_seconds=$SECONDS
      sync
      total_seconds=$SECONDS

      echo '=== After SDK cleanup ==='
      after_bytes="$(df -B1 --output=avail / | awk 'NR == 2 {print $1}')"
      df -B1 -T /
      awk -v before="$before_bytes" -v after="$after_bytes" \
        -v removal="$removal_seconds" -v total="$total_seconds" \
        'BEGIN {
          printf "Free before: %.2f GiB (%s bytes)\n", before / 1073741824, before
          printf "Free after: %.2f GiB (%s bytes)\n", after / 1073741824, after
          printf "Space reclaimed: %.2f GiB (%.0f bytes)\n", (after - before) / 1073741824, after - before
          printf "Deletion time: %d seconds\n", removal
          printf "Deletion and sync time: %d seconds\n", total
        }'
    displayName: Remove unused Linux SDKs and measure savings

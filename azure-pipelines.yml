trigger:
  branches:
    include:
      - main

strategy:
  matrix:
    ubuntu_22_04:
      vmImage: ubuntu-22.04
    ubuntu_24_04:
      vmImage: ubuntu-24.04
    ubuntu_26_04:
      vmImage: ubuntu-26.04
    windows_2022:
      vmImage: windows-2022
    windows_2025:
      vmImage: windows-2025

pool:
  vmImage: $(vmImage)

variables:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

steps:
  - checkout: none

  - pwsh: |
      Write-Host '=== Azure Pipelines ==='
      Write-Host "Requested image: $env:REQUESTED_IMAGE"
      Write-Host "Agent: $env:AGENT_NAME"
      Write-Host "OS: $env:AGENT_OS"
      Write-Host "Architecture: $env:AGENT_OSARCHITECTURE"
      Write-Host "Image: $env:ImageOS ($env:ImageVersion)"
      Write-Host "Workspace: $env:PIPELINE_WORKSPACE"
      Write-Host "Temp directory: $env:AGENT_TEMPDIRECTORY"
    displayName: Show image and agent details
    env:
      REQUESTED_IMAGE: $(vmImage)

  - bash: |
      set -euo pipefail

      echo '=== All filesystems (GiB) ==='
      df -BG -T
      echo '=== Workspace and temp filesystems (GiB) ==='
      df -BG -T "$PIPELINE_WORKSPACE" "$AGENT_TEMPDIRECTORY"
    displayName: Show Linux disk space
    condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'))

  - pwsh: |
      Write-Host '=== Local disks (GiB) ==='
      Get-CimInstance Win32_LogicalDisk -Filter 'DriveType = 3' |
        Sort-Object DeviceID |
        Select-Object DeviceID, VolumeName, FileSystem,
          @{Name='SizeGiB'; Expression={[math]::Round($_.Size / 1GB, 2)}},
          @{Name='UsedGiB'; Expression={[math]::Round(($_.Size - $_.FreeSpace) / 1GB, 2)}},
          @{Name='FreeGiB'; Expression={[math]::Round($_.FreeSpace / 1GB, 2)}} |
        Format-Table -AutoSize
    displayName: Show Windows disk space
    condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'))

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  downstreamPipelineId: '227' # ID Pipeline B

steps:
  - checkout: self

  - bash: |
      set -euo pipefail

      echo "Build ID: $BUILD_ID"
      echo "Build Number: $BUILD_NUMBER"
      echo "Branch: $SOURCE_BRANCH"

      # Serialize custom configuration to JSON string
      TEST_CONFIG_JSON=$(jq -nc '{
        environment: "staging",
        suite: "regression",
        retryCount: 2,
        notifyTeam: true,
        browsers: ["chromium", "firefox"],
        metadata: {
          owner: "QA Team",
          ticket: "QA-1042",
          priority: "high"
        }
      }')

      # Build request payload
      jq -n \
        --arg buildId "$BUILD_ID" \
        --arg buildNumber "$BUILD_NUMBER" \
        --arg branch "$SOURCE_BRANCH" \
        --arg config "$TEST_CONFIG_JSON" \
        '{
          templateParameters: {
            sourceBuildId: $buildId,
            sourceBuildNumber: $buildNumber,
            sourceBranch: $branch,
            customMessage: "Hello from Pipeline A!",
            releaseTag: "v1.2.3-rc1",
            testConfigJson: $config
          }
        }' > payload.json

      echo "Request payload:"
      jq . payload.json

      echo "Triggering Pipeline B..."

      HTTP_CODE=$(curl \
        --silent \
        --show-error \
        --request POST \
        --header "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
        --header "Content-Type: application/json" \
        --header "Accept: application/json" \
        --data @payload.json \
        --output response.json \
        --write-out '%{http_code}' \
        "${COLLECTION_URI}${PROJECT_ID}/_apis/pipelines/${PIPELINE_ID}/runs?api-version=7.1")

      echo "HTTP status: $HTTP_CODE"

      if [[ ! "$HTTP_CODE" =~ ^2[0-9]{2}$ ]]; then
        echo "Azure DevOps API error response:"
        jq . response.json 2>/dev/null || cat response.json
        exit 1
      fi

      echo "Pipeline B queued successfully:"
      jq '{id, name, state}' response.json

    displayName: Trigger Pipeline B

    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      COLLECTION_URI: $(System.TeamFoundationCollectionUri)
      PROJECT_ID: $(System.TeamProjectId)
      PIPELINE_ID: $(downstreamPipelineId)

      BUILD_ID: $(Build.BuildId)
      BUILD_NUMBER: $(Build.BuildNumber)
      SOURCE_BRANCH: $(Build.SourceBranch)
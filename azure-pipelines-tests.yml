trigger: none
pr: none

parameters:
  - name: sourceBuildId
    type: string
    default: 'unknown'

  - name: sourceBuildNumber
    type: string
    default: 'unknown'

  - name: sourceBranch
    type: string
    default: 'unknown'

  - name: customMessage
    type: string
    default: 'none'

  - name: releaseTag
    type: string
    default: 'none'

  - name: testConfigJson
    type: string
    default: '{}'

pool:
  vmImage: ubuntu-latest

jobs:
  - job: TestJob
    displayName: Print received parameters

    steps:
      - checkout: self

      - bash: |
          bash scripts/run-tests.sh
        displayName: Print all parameters

        env:
          SOURCE_BUILD_ID: ${{ parameters.sourceBuildId }}
          SOURCE_BUILD_NUMBER: ${{ parameters.sourceBuildNumber }}
          SOURCE_BRANCH: ${{ parameters.sourceBranch }}
          CUSTOM_MESSAGE: ${{ parameters.customMessage }}
          RELEASE_TAG: ${{ parameters.releaseTag }}
          TEST_CONFIG_JSON: ${{ parameters.testConfigJson }}